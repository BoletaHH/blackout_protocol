  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%;overflow:hidden}
body{
  margin:0;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:80px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:560px;margin:0 auto;position:relative;z-index:1}
.logo{aspect-ratio:2008/793;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
body::before{content:"";position:fixed;left:50%;top:46%;width:min(150vw,980px);aspect-ratio:2008/793;transform:translate(-50%,-50%);
  background:var(--wm);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;pointer-events:none;z-index:0}
body.is-landing::before{display:none}

/* landing */
.landing{min-height:calc(100svh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 0 24px}
.landing .logo{width:min(86%,420px)}
.landing h1{font-size:clamp(40px,12.5vw,60px);line-height:.95;text-transform:uppercase;letter-spacing:.08em;margin-top:34px}
.landing .tagline{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-top:10px;padding-left:.32em}
.quote{margin:44px 0 0;max-width:340px;font-family:var(--mono);font-size:clamp(20px,6.2vw,27px);font-weight:300;line-height:1.4;letter-spacing:-.01em;color:var(--fg);text-wrap:balance}
.cta{margin-top:36px;min-height:54px;padding:0 34px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;letter-spacing:.02em}
.cta:active{background:var(--accent-press)}
.landing .wkline{margin-top:14px;font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.02em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px;padding-bottom:6px}
.top h1{font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.top .sub{color:var(--muted);font-size:14px;margin-top:6px}
.status{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.status.err{color:var(--accent)}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;padding:14px 0 0;min-height:44px}
.back:active{color:var(--fg)}

/* week switcher */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px;padding:6px;background:var(--surface);border-radius:12px}
.weekbar .mid{text-align:center}
.weekbar .wk{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.weekbar .tag{font-size:12px;color:var(--muted);margin-top:2px}
.weekbar .tag.cur{color:var(--accent)}
.arrow{width:48px;height:48px;border-radius:10px;font-size:22px;color:var(--fg);display:grid;place-items:center}
.arrow:active{background:var(--surface-2)}
.arrow[disabled]{opacity:.25;cursor:default}

/* day buttons */
.days{display:grid;gap:10px}
.day{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border-radius:14px;padding:16px 16px 16px 14px;min-height:76px;border:1px solid transparent}
.day:active{background:var(--surface-2);border-color:var(--line)}
.day .n{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--accent);width:34px;text-align:center}
.day .t{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1.05}
.day .f{color:var(--muted);font-size:14px;margin-top:3px}
.day .p{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.day .p b{color:var(--fg);font-weight:600}
.day .p.full b{color:var(--accent)}

.newweek{margin-top:22px;width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);color:var(--fg);font-weight:500}
.newweek:active{background:var(--surface-2)}
.newweek.armed{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hint{color:var(--muted);font-size:13px;margin-top:8px;text-align:center}

/* workout */
.dayhead{padding:6px 0 4px}
.dayhead .kick{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.dayhead h1{font-size:38px;text-transform:uppercase;line-height:1.02;margin-top:2px}
.dayhead .sub{color:var(--muted);font-size:14px;margin-top:4px}

.ex{padding:24px 0 22px;border-bottom:1px solid var(--line)}
.ex:last-of-type{border-bottom:0}
.ex h2{font-size:38px;line-height:1.04;letter-spacing:.02em}
.ex h2 .num{color:var(--accent);margin-right:2px}
.ex .opt{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 8px;padding:0}
.spec div{min-width:0;background:var(--surface);border-radius:10px;padding:8px 6px 7px;text-align:center}
.spec dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:1px 0 0;font-family:var(--display);font-size:21px;line-height:1.1;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.spec dd.sm{font-size:16px}
.topset{display:flex;flex-direction:column;gap:4px;background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.topset .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.topset .val{font-family:var(--display);font-size:26px;line-height:1;font-weight:600;letter-spacing:.02em;color:var(--accent);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px}

.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 22px;gap:8px;align-items:center}
.set .no{font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:42px;border-radius:8px;border:1px solid transparent;background:rgba(0,0,0,.2);color:var(--fg);
  font:500 16px var(--body);font-variant-numeric:tabular-nums;padding:0 40px 0 12px;appearance:none;-webkit-appearance:none}
.field input::placeholder{color:#5f5d57;font-weight:400}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:#7d7b74;pointer-events:none}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.tick svg{width:11px;height:11px}
.set.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.prev{margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prev b{font-weight:500;color:#d4d1c8}

/* progress */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;min-width:64px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pcard{background:var(--surface);border-radius:14px;padding:16px 14px 12px;margin-top:14px}
.pcard .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pcard h3{font-size:25px;line-height:1.1}
.pcard .metric{font-size:12px;color:var(--muted);margin-top:3px}
.chg{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.02em;white-space:nowrap;text-align:right;line-height:1.1}
.chg small{display:block;font-family:var(--body);font-size:11px;font-weight:400;letter-spacing:0;color:var(--muted);margin-top:2px}
.readout{font-size:13px;color:#d4d1c8;margin:12px 0 2px;min-height:20px;font-variant-numeric:tabular-nums}
.chart{display:block;width:100%;height:auto;touch-action:manipulation}
.chart text{font-family:var(--body);font-variant-numeric:tabular-nums}
.chart [data-tip]{cursor:pointer;-webkit-tap-highlight-color:transparent}
details.dtl{margin-top:6px}
details.dtl summary{cursor:pointer;color:var(--muted);font-size:13px;padding:10px 0;min-height:44px;display:flex;align-items:center}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top;color:#d4d1c8}
td.w{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.04em;white-space:nowrap;color:var(--fg)}
.empty{color:var(--muted);padding:28px 4px;text-align:center}

/* info */
.panel{background:var(--surface);border-radius:14px;padding:18px 16px;margin-top:14px}
.panel h2{font-size:24px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.panel p{margin:0;color:#e8e6df}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.panel li{position:relative;padding-left:18px;color:#e8e6df}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.panel .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;color:var(--accent)}
.panel .big small{font-size:20px;color:var(--fg);font-weight:600;letter-spacing:.04em;margin-left:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);background:var(--bg);border-top:1px solid var(--line);
  padding:0 max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-right,0px));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:68px repeat(3,1fr)}
.tab{min-height:56px;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:0 4px;font-weight:500;position:relative}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab .logo{width:44px}

/* progressive overload pop-up */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(15,15,14,.78);
  padding:20px max(20px,env(safe-area-inset-left,0px)) 20px max(20px,env(safe-area-inset-right,0px))}
.modal[hidden]{display:none}
.modal .wrapm{width:100%;max-width:400px}
.modal .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 24px 36px;text-align:center}
.modal .logo{width:min(78%,260px);margin:0 auto 26px}
.modal h2{font-size:clamp(44px,14.5vw,64px);font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);padding-left:.04em;white-space:nowrap}
.modal .sub{margin-top:14px;font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg);text-wrap:balance}
.modal .sub span{color:var(--accent)}
.modal .cta{display:block;width:100%;margin-top:14px}
@media (prefers-reduced-motion:no-preference){.modal .wrapm{animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
@media (prefers-reduced-motion:no-preference){.day,.chip,.arrow{transition:background .12s,border-color .12s}}

/* standalone page basics */
[hidden]{display:none!important}
img{max-width:100%}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);font-family:var(--mono);font-size:14px;color:var(--fg);padding:0 8px}
.btn:active{background:var(--surface-2)}
.btnrow.three{grid-template-columns:1fr 1fr auto}
.btnrow.three .danger{padding:0 14px}
.btn.danger{font-family:var(--body);font-weight:600;color:var(--accent)}
.modal h2.q{font-size:32px;line-height:1.1;color:var(--fg);letter-spacing:.03em;text-transform:none;white-space:normal;padding:0}
.modal .why{margin:12px 0 0;font-size:14px;color:var(--muted)}
.modal .plain{display:block;width:100%;min-height:44px;margin-top:6px;color:var(--muted);font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-family:var(--body);font-weight:600}
.msg{margin-top:12px;font-size:13px;color:#d4d1c8;min-height:18px}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>

<script>
/* ---------- Plan ---------- */
const PLAN = [
  {n:1, name:"Pull 1", focus:"Deadlift focus", ex:[
    ["Deadlift","3","3-5","8","365 lb","3 min","3"],
    ["Pull-Ups","3","8-12","8-9","Bodyweight","3 min",""],
    ["T-Bar Row","2","6-9","8-9","90 lb","2 min",""],
    ["Farmer's Carries","2","2 mat runs","","315 lb","2 min",""],
    ["Rear Delt Flies","3","7-12","10","70 kg","1:30",""],
    ["Rope Bicep Curl","3","10-15","10","140 lb","1:30",""],
    ["Abs","3","10-15","10","Bodyweight","1 min",""]]},
  {n:2, name:"Push 1", focus:"Military Press focus", ex:[
    ["Military Press","3","4-6","8-9","135 lb","3 min",""],
    ["Incline Dumbbell Press","4","6-9","9","80 lb","3 min",""],
    ["Dips","3","8-12","10","Bodyweight","2 min",""],
    ["Lateral Raises","5","12-15","10","20 lb","1:30",""],
    ["Triceps Pushdown","3","7-10","10","160 lb","1:30",""]]},
  {n:3, name:"Legs", focus:"Zercher Squat focus", ex:[
    ["Zercher Squat","3","6-9","8","135 lb","3 min",""],
    ["Walking Lunges","3","8-10","8","40 lb","2 min",""],
    ["Leg Extensions","2","12-15","9","TBD","1:30",""],
    ["Leg Curls","2","12-15","9","TBD","1:30",""],
    ["Calf Raises","3","12-15","9","200 lb","1:30",""],
    ["Abs","3","10-15","9","Bodyweight","1 min",""],
    ["Bulgarian Split Squat (optional)","3","6-10","8","TBD","2 min",""]]},
  {n:4, name:"Pull 2", focus:"Row focus", ex:[
    ["T-Bar Row","3","6-9","9","90 lb","3 min",""],
    ["Pull-Ups","3","6-9","9","Bodyweight","3 min",""],
    ["Rack Pulls","2","4-6","7-8","405 lb","3 min",""],
    ["Farmer's Carries","2","30-40 m","9","315 lb","2 min",""],
    ["Rear Delt Flies","3","10-12","9","70 kg","1:30",""],
    ["Dumbbell Curl","3","6-9","9","45 lb","1:30",""],
    ["Rope Curl","3","10-12","9","140 lb","1:30",""]]},
  {n:5, name:"Push 2", focus:"Military Press focus", ex:[
    ["Military Press","3","4-6","8-9","135 lb","3 min",""],
    ["Incline Dumbbell Press","4","6-9","9","80 lb","3 min",""],
    ["Dips (Chest Lean)","2-3","8-12","9","Bodyweight","2 min",""],
    ["Lateral Raises","5","12-15","10","20 lb","1:30",""],
    ["Triceps Pushdown","3","10-12","10","160 lb","1:30",""],
    ["Abs","3","10-15","9","Bodyweight","1 min",""]]}
].map(d => ({...d, ex: d.ex.map(([raw,sets,reps,rpe,weight,rest,topReps]) => {
  const opt = /\(optional\)/i.test(raw);              // optional exercises are shown but never logged or counted
  const name = raw.replace(/\s*\(optional\)/i,"").trim();
  const bw = /^bodyweight$/i.test(weight);
  const m = weight.match(/^([\d.]+)\s*(\w+)$/);
  return {name, opt, sets, reps, rpe, weight, rest, topReps, bw, unit: m ? m[2] : (bw ? "" : "lb"), nSets: Math.max(...sets.split("-").map(Number))};
})}));
/* Top set shown as "weight × reps". topReps is what you hit on that set; "" shows a dash until you send the number. */
const topText = ex => ex.weight === "TBD" ? "TBD" : ex.weight + " × " + (ex.topReps ? ex.topReps + " reps" : "– reps");
/* The Top set shown on a day page. Every pop-up (progressive overload) replaces it with the set that triggered it, saved in meta.top["day:exIndex"] = [weight, reps]. */
const topOverride = (day, i) => (S.meta.top && S.meta.top[day + ":" + i]) || null;
const topLabel = (day, i) => { const ex = PLAN[day - 1].ex[i], o = topOverride(day, i); return o ? fmtTop({ w: o[0], r: o[1] }, ex) : topText(ex); };

const INFO = {
  cardio: "Zone 2 cardio: 150 min weekly (for example 25 min, 6 days a week).",
  rules: [
    "Main lifts (Deadlift, Military Press, Zercher Squat, T-Bar Row, Pull-Ups): about 3 min rest.",
    "Weight follows RPE: pick the load that lands in the target RPE. Don't force a number.",
    "Military Press stays at RPE 9 or lower (1 rep in reserve). Isolation work can go to failure.",
    "Tired day: drop a set per exercise, keep every movement.",
    "If tracked lifts stall or drop for 2 weeks, or joints complain, lower RPE by 1 on main lifts first."
  ]
};

/* ---------- State ---------- */
let S = { meta: { week: 1, notes: "", top: {} }, weeks: {} };   // weeks[n] = { logs: { "day:exIndex": [[weight, reps], ...] } }
const ui = { view: "landing", day: 1, week: null, pday: 1, armed: false, status: "loading" };
const LS_KEY = "blackout-protocol:v1";

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const viewWeek = () => ui.week ?? S.meta.week;
const logsOf = n => (S.weeks[n] && S.weeks[n].logs) || {};
const setsOf = (n, day, i) => logsOf(n)[day + ":" + i] || [];
const filled = s => s && String(s[1] ?? "").trim() !== "";
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; };
const fmtSet = (s, ex) => (String(s[0] ?? "").trim() || (ex.bw ? "BW" : "–")) + " × " + String(s[1]).trim();

/* ---------- Persistence: everything is kept in this phone's localStorage; export_data_ / import_data_ move a copy in and out ---------- */
let col = null, localMode = false;
const dirty = {}, inflight = {}, timers = {};

function setStatus(st) {
  ui.status = st;
  const el = document.getElementById("status");
  if (el) paintStatus(el);
}
function paintStatus(el) {
  const t = { loading:"Loading…", saved:"Saved", saving:"Saving…", error:"Not saved. Will retry on next edit", device:"Saved on this device" }[ui.status] || "";
  el.textContent = t;
  el.classList.toggle("err", ui.status === "error");
}
function backup() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

function markDirty(key) {
  dirty[key] = true;
  backup();
  if (localMode) { setStatus("device"); return; }
  setStatus("saving");
  clearTimeout(timers[key]);
  timers[key] = setTimeout(() => flush(key), 500);
}
async function flush(key) {
  if (!col) return;
  if (inflight[key]) { timers[key] = setTimeout(() => flush(key), 300); return; }
  dirty[key] = false; inflight[key] = true;
  let ok = true;
  try {
    if (key === "meta") await col.doc("meta").set({ week: S.meta.week, notes: S.meta.notes || "", top: S.meta.top || {} });
    else { const n = +key.slice(1); await col.doc(key).set({ n, logs: logsOf(n) }); }
  } catch (e) { ok = false; dirty[key] = true; }
  inflight[key] = false;
  if (!ok) { setStatus("error"); return; }
  if (dirty[key]) timers[key] = setTimeout(() => flush(key), 300);
  else if (!Object.values(dirty).some(Boolean) && !Object.values(inflight).some(Boolean)) setStatus("saved");
}

function applySnapshot(snap) {
  snap.docs.forEach(d => {
    const id = d.id, v = d.data() || {};
    if (dirty[id] || inflight[id]) return;
    if (id === "meta") S.meta = { week: Math.max(1, +v.week || 1), notes: typeof v.notes === "string" ? v.notes : "", top: JSON.parse(JSON.stringify(v.top || {})) };
    else if (/^w\d+$/.test(id)) S.weeks[+id.slice(1)] = { logs: JSON.parse(JSON.stringify(v.logs || {})) };
  });
  if (ui.status === "loading") setStatus("saved");
  if (!document.activeElement || !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) render();
}

function boot() {
  localMode = true;
  zeroTop();   // first launch (or no saved data): every Top set starts at 0 weight x 0 reps
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const v = JSON.parse(raw); if (v && v.meta && v.weeks) { S = v; S.meta.top = S.meta.top || {}; } }
  } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  setStatus("device");
  render();
}

/* ---------- Rendering ---------- */
const root = document.getElementById("app");
const tabsEl = document.getElementById("tabs");

function renderTabs() {
  const cur = ui.view === "day" ? "home" : ui.view;
  const t = [["home","Workouts"],["progress","Progress"],["info","Extra Information"]];
  tabsEl.innerHTML = `<button class="tab" data-go="landing" aria-label="Home" ${cur==="landing"?'aria-current="page"':""}><span class="logo" role="img" aria-label="Blackout Protocol"></span></button>` +
    t.map(([k,l]) => `<button class="tab" data-go="${k}" ${cur===k?'aria-current="page"':""}>${l}</button>`).join("");
}

function renderLanding() {
  return `<section class="landing">
    <div class="logo" role="img" aria-label="Blackout Protocol logo"></div>
    <h1>Blackout Protocol</h1>
    <div class="tagline">Training Log</div>
    <button class="cta" data-go="home">LOG</button>
    <div class="wkline">Week ${S.meta.week} · current</div>
    <div class="status" id="status"></div>
    <p class="quote">&quot;Can't have the outcome without the lifestyle&quot;</p>
  </section>`;
}

function head(title, sub) {
  return `<header class="top"><div><h1>${esc(title)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}<div class="status" id="status"></div></div></header>`;
}

function weekBar() {
  const w = viewWeek(), cur = w === S.meta.week;
  return `<div class="weekbar">
    <button class="arrow" data-week="-1" aria-label="Previous week" ${w<=1?"disabled":""}>‹</button>
    <div class="mid"><div class="wk">Week ${w}</div><div class="tag ${cur?"cur":""}">${cur ? "Current week" : "Past week · tap › to go forward"}</div></div>
    <button class="arrow" data-week="1" aria-label="Next week" ${cur?"disabled":""}>›</button>
  </div>`;
}

function dayProgress(w, d) {
  const tracked = d.ex.map((ex, i) => ({ ex, i })).filter(o => !o.ex.opt);   // optional lifts are not counted
  const done = tracked.filter(o => setsOf(w, d.n, o.i).some(filled)).length;
  return { done, total: tracked.length };
}

function renderHome() {
  const w = viewWeek();
  const list = PLAN.map(d => {
    const p = dayProgress(w, d);
    return `<button class="day" data-day="${d.n}">
      <span class="n">${d.n}</span>
      <span><div class="t">${esc(d.name)}</div><div class="f">${esc(d.focus)}</div></span>
      <span class="p ${p.done===p.total?"full":""}"><b>${p.done}</b>/${p.total}<br>logged</span>
    </button>`;
  }).join("");
  const isCur = w === S.meta.week;
  return head("Workouts", "5 days · strength") + weekBar() + `<div class="days">${list}</div>` +
    (isCur ? `<button class="newweek ${ui.armed?"armed":""}" data-newweek>${ui.armed ? `Tap again to start Week ${S.meta.week+1}` : `Start Week ${S.meta.week+1}`}</button>
      <div class="hint">Your Week ${S.meta.week} log stays saved for comparison.</div>` : "");
}

function renderDay() {
  const d = PLAN[ui.day - 1], w = viewWeek();
  const exs = d.ex.map((ex, i) => {
    const spec = `<dl class="spec">
        <div><dt>Sets</dt><dd>${esc(ex.sets)}</dd></div>
        <div><dt>Reps</dt><dd class="${ex.reps.length > 5 ? "sm" : ""}">${esc(ex.reps)}</dd></div>
        <div><dt>RPE</dt><dd>${esc(ex.rpe || "–")}</dd></div>
        <div><dt>Rest</dt><dd>${esc(ex.rest)}</dd></div>
      </dl>
      <div class="topset"><span class="lbl">Top set</span><span class="val" data-top="${d.n}:${i}">${esc(topLabel(d.n, i))}</span></div>`;
    if (ex.opt) return `<section class="ex"><h2><span class="num">${i+1}.</span> ${esc(ex.name)}<span class="opt">Optional</span></h2>${spec}<div class="note">Optional exercise. Not logged and not counted.</div></section>`;
    const mine = setsOf(w, d.n, i), prev = setsOf(w - 1, d.n, i);
    const rows = Array.from({ length: ex.nSets }, (_, s) => {
      const cur = mine[s] || ["", ""], pv = prev[s] || [];
      const done = filled(cur);
      return `<div class="set ${done?"done":""}" data-row>
        <span class="no">${s+1}</span>
        <label class="field"><input inputmode="decimal" autocomplete="off" enterkeyhint="next" id="w-${d.n}-${i}-${s}" data-k="${d.n}:${i}" data-s="${s}" data-f="0" value="${esc(cur[0] ?? "")}" placeholder="${esc(pv[0] || (ex.bw ? "BW" : "0"))}" aria-label="${esc(ex.name)} set ${s+1} weight"><span class="u">${esc(ex.unit || (ex.bw ? "+" : ""))}</span></label>
        <label class="field"><input inputmode="decimal" autocomplete="off" enterkeyhint="next" id="r-${d.n}-${i}-${s}" data-k="${d.n}:${i}" data-s="${s}" data-f="1" value="${esc(cur[1] ?? "")}" placeholder="${esc(pv[1] || "0")}" aria-label="${esc(ex.name)} set ${s+1} reps"><span class="u">reps</span></label>
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.6 2.6L10 3.4"/></svg></span>
      </div>`;
    }).join("");
    const pvDone = prev.filter(filled);
    const prevLine = w > 1 ? `<div class="prev">Last week: ${pvDone.length ? `<b>${pvDone.map(s => esc(fmtSet(s, ex))).join("  ·  ")}</b>` : "no data"}</div>` : "";
    return `<section class="ex"><h2><span class="num">${i+1}.</span> ${esc(ex.name)}</h2>${spec}<div class="sets">${rows}</div>${prevLine}</section>`;
  }).join("");
  return `<button class="back" data-go="home">‹ All days</button>
    <header class="dayhead"><div class="kick">Day ${d.n} · Week ${w}</div><h1>${esc(d.name)}</h1><div class="sub">${esc(d.focus)}</div><div class="status" id="status"></div></header>${exs}`;
}

/* progress */
const fmtN = v => String(Math.round(v * 100) / 100);
function niceStep(range, ticks) {
  const raw = range / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}
/* Top set of one week: the heaviest set, ties broken by reps. Sets with no weight count as weight 0 (bodyweight). */
function topSet(sets) {
  let best = null;
  (sets || []).filter(filled).forEach(s => {
    const r = num(s[1]); if (r === null) return;
    const w = Math.max(0, num(s[0]) ?? 0);
    if (!best || w > best.w || (w === best.w && r > best.r)) best = { w, r };
  });
  return best;
}
const stronger = (a, b) => a.w > b.w || (a.w === b.w && a.r > b.r);
function fmtTop(t, ex) {
  const reps = t.r === Infinity ? "–" : fmtN(t.r);
  const rl = t.r === 1 ? " rep" : " reps";
  if (ex.bw) return (t.w ? "+" + fmtN(t.w) : "Bodyweight") + " × " + reps + rl;
  return fmtN(t.w) + " " + ex.unit + " × " + reps + rl;
}
/* Line chart: one series (top set per week), one y axis. Weeks that were skipped are left out, so points sit side by side. */
function lineChart(pts, o) {
  const W = 340, H = 232, ml = 48, mr = 20, mt = 32, mb = 44, inset = 18, n = pts.length;
  const ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = lo === hi ? Math.max(1, Math.abs(lo) * 0.1) : (hi - lo) * 0.25;
  lo = Math.max(0, lo - pad); hi = hi + pad;
  const step = niceStep(hi - lo, 4);
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const X = i => n === 1 ? (ml + W - mr) / 2 : ml + inset + i * (W - ml - mr - 2 * inset) / (n - 1);
  const Y = y => mt + (1 - (y - y0) / (y1 - y0)) * (H - mt - mb);
  const yt = []; for (let v = y0; v <= y1 + step / 2; v += step) yt.push(Math.round(v * 1000) / 1000);
  const xs = Math.ceil(n / 8);
  const gid = "g" + o.id;
  const line = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const area = line + ` L${X(n-1).toFixed(1)} ${Y(y0).toFixed(1)} L${X(0).toFixed(1)} ${Y(y0).toFixed(1)} Z`;
  const showAll = n <= 6;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    ${yt.map(v => `<line x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" ${v === y0 ? "" : 'stroke-dasharray="2 4"'}/>
      <text x="${ml-9}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(v)}</text>`).join("")}
    ${pts.map((p, i) => (i % xs === 0 || i === n - 1) ? `<text x="${X(i).toFixed(1)}" y="${H-mb+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.wk}</text>` : "").join("")}
    <text x="${((ml + W - mr) / 2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="var(--muted)">WEEK</text>
    <text transform="translate(12 ${((mt + H - mb) / 2).toFixed(1)}) rotate(-90)" text-anchor="middle" font-size="11" letter-spacing="1.2" fill="var(--muted)">${esc(o.yTitle)}</text>
    ${n > 1 ? `<path d="${area}" fill="url(#${gid})"/>` : ""}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("")}
    ${pts.map((p, i) => (showAll || i === n - 1) ? `<text x="${X(i).toFixed(1)}" y="${(Y(p.y)-11).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)">${esc(p.label)}</text>` : "").join("")}
    ${pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="18" fill="transparent" data-tip="${esc(p.tip)}"/>`).join("")}
  </svg>`;
}
function renderProgress() {
  const d = PLAN[ui.pday - 1];
  const weeks = Object.keys(S.weeks).map(Number).sort((a, b) => a - b);
  const chips = PLAN.map(x => `<button class="chip" data-pday="${x.n}" aria-pressed="${x.n===ui.pday}">Day ${x.n}</button>`).join("");
  let any = false;
  const cards = d.ex.map((ex, i) => {
    if (ex.opt) return "";
    const rows = weeks.map(n => ({ wk: n, top: topSet(setsOf(n, d.n, i)) })).filter(r => r.top);   // skipped weeks are not included
    if (!rows.length) return "";
    any = true;
    const useW = rows.some(r => r.top.w > 0);
    const unit = useW ? (ex.unit || "added") : "reps";
    const pts = rows.map(r => ({
      wk: r.wk, y: useW ? r.top.w : r.top.r, top: r.top,
      label: useW ? fmtN(r.top.w) + "×" + fmtN(r.top.r) : fmtN(r.top.r),
      tip: `Week ${r.wk} · top set ${fmtTop(r.top, ex)}`
    }));
    const first = pts[0], last = pts[pts.length - 1], dv = Math.round((last.y - first.y) * 100) / 100;
    const chg = pts.length > 1 ? `<div class="chg">${dv > 0 ? "▲ +" : dv < 0 ? "▼ " : "= "}${dv === 0 ? "0" : fmtN(dv)} ${esc(unit)}<small>since week ${first.wk}</small></div>` : "";
    const yTitle = useW ? (ex.unit ? `WEIGHT (${ex.unit.toUpperCase()})` : "ADDED WEIGHT") : "TOP SET REPS";
    const table = [...rows].reverse().map(r => `<tr><td class="w">W${r.wk}</td><td>${esc(fmtTop(r.top, ex))}</td></tr>`).join("");
    return `<div class="pcard"><div class="hd"><div><h3>${esc(ex.name)}</h3><div class="metric">Top set each week · weeks you skipped are left out</div></div>${chg}</div>
      <div class="readout" aria-live="polite">${esc(last.tip)}</div>
      ${lineChart(pts, { id: ui.pday + "_" + i, label: `${ex.name}: top set by week`, yTitle })}
      <details class="dtl"><summary>View data</summary><div class="wrap"><table><thead><tr><th>Week</th><th>Top set</th></tr></thead><tbody>${table}</tbody></table></div></details></div>`;
  }).join("");
  return head("Progress", d.name + " · " + d.focus) + `<div class="chips" role="group" aria-label="Choose a day">${chips}</div>` +
    (any ? cards : `<div class="empty">No sets logged for Day ${d.n} yet.<br>Log a workout and the charts will appear here, week by week.</div>`);
}

/* ---------- Progressive overload pop-up ---------- */
/* A set fires the pop-up when it beats the Top set shown on the day page:
   no Top set recorded yet -> any new set; heavier weight -> always (reps do not matter);
   same weight -> only with more reps; same weight and reps, or lighter weight with more reps -> no.
   A Top set with no reps recorded counts as 0 reps. Each pop-up replaces the shown Top set with the set that triggered it. */
function checkPR(day, i, week, si) {
  const ex = PLAN[day - 1].ex[i]; if (ex.opt) return;
  const s = setsOf(week, day, i)[si]; if (!filled(s)) return;
  const r = num(s[1]); if (r === null || r <= 0) return;
  const w = Math.max(0, num(s[0]) ?? 0);
  if (!ex.bw && w <= 0) return;                                      // a weighted lift needs a weight
  const cand = { w, r }, o = topOverride(day, i);
  let thr;
  if (o) thr = { w: o[0], r: o[1] };
  else if (ex.bw) thr = { w: 0, r: ex.topReps ? +ex.topReps : 0 };
  else if (num(ex.weight) !== null) thr = { w: num(ex.weight), r: ex.topReps ? +ex.topReps : 0 };
  else thr = { w: 0, r: 0 };                                         // "TBD": no Top set recorded yet
  if (!stronger(cand, thr)) return;
  (S.meta.top || (S.meta.top = {}))[day + ":" + i] = [cand.w, cand.r];
  markDirty("meta");
  document.querySelectorAll('[data-top="' + day + ":" + i + '"]').forEach(el => { el.textContent = topLabel(day, i); });
  showPR();
}
const modalEl = document.getElementById("modal");
function showPR() {
  modalEl.innerHTML = `<div class="wrapm">
    <div class="card">
      <div class="logo" role="img" aria-label="Blackout Protocol"></div>
      <h2 id="mTitle">Strong</h2>
      <div class="sub">Progressive Overload <span>Achieved</span></div>
    </div>
    <button class="cta" id="mClose">Continue</button>
  </div>`;
  modalEl.hidden = false;
  const b = document.getElementById("mClose"); if (b) b.focus({ preventScroll: true });
}
function closePR() { modalEl.hidden = true; modalEl.innerHTML = ""; }
modalEl.addEventListener("click", e => {
  if (e.target.id === "mReset") return doReset();
  if (e.target === modalEl || e.target.id === "mClose" || e.target.id === "mCancel") closePR();
});
/* Reset: every logged weight and rep goes to zero, and so does every Top set (weight 0, reps 0). Back to week 1. The plan details stay. */
function askReset() {
  modalEl.innerHTML = `<div class="wrapm"><div class="card">
    <h2 class="q" id="mTitle">Sure you want to reset?</h2>
    <p class="why">This sets every weight and rep to zero, including all Top sets. The plan stays. Export a backup first if you may want your data back.</p>
    <button class="cta" id="mReset" style="margin-top:22px;width:100%">Continue</button>
    <button class="plain" id="mCancel">Cancel</button>
  </div></div>`;
  modalEl.hidden = false;
  const b = document.getElementById("mCancel"); if (b) b.focus({ preventScroll: true });
}
function zeroTop() { S.meta.top = {}; PLAN.forEach(d => d.ex.forEach((ex, i) => { S.meta.top[d.n + ":" + i] = [0, 0]; })); }
function doReset() {
  S.weeks = {}; S.meta.week = 1; S.meta.top = {};
  zeroTop();
  ui.week = null; ui.pending = null; ui.armed = false;
  backup(); setStatus("device"); closePR();
  ui.bmsg = "Reset done. Every weight and rep is at zero. Back to week 1."; render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modalEl.hidden) closePR(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (!t.dataset || t.dataset.k === undefined) return;
  const [day, i] = t.dataset.k.split(":").map(Number);
  checkPR(day, i, viewWeek(), +t.dataset.s);
});

function renderInfo() {
  return head("Extra Information", "Rules, cardio and backup") +
    `<section class="panel"><h2>Cardio</h2><div class="big">150<small>min / week</small></div><p style="margin-top:8px">${esc(INFO.cardio)}</p></section>
     <section class="panel"><h2>Rules</h2><ul>${INFO.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul></section>
     <section class="panel"><h2>Backup</h2><p style="color:var(--muted);font-size:14px">Your data lives only on this phone. Export a copy now and then. Import restores it, or moves it to a new phone. Reset sets every weight and rep to zero.</p>
       <div class="btnrow three"><button class="btn" data-export>export_data_</button><button class="btn" data-import>import_data_</button><button class="btn danger" data-reset>Reset</button></div>
       <div class="msg" id="bmsg" aria-live="polite">${esc(ui.bmsg || "")}</div>
       ${ui.pending ? `<div class="btnrow"><button class="btn primary" data-confirm-import>Replace my data</button><button class="btn" data-cancel-import>Cancel</button></div>` : ""}
       <input type="file" id="importFile" accept="application/json,.json" hidden></section>`;
}

function render() {
  const y = document.body.scrollTop;
  root.innerHTML = ui.view === "landing" ? renderLanding() : ui.view === "home" ? renderHome() : ui.view === "day" ? renderDay() : ui.view === "progress" ? renderProgress() : renderInfo();
  document.body.classList.toggle("is-landing", ui.view === "landing");
  renderTabs();
  const st = document.getElementById("status"); if (st) paintStatus(st);
  if (ui._keepScroll) { document.body.scrollTop = y; ui._keepScroll = false; }
}

/* ---------- Events ---------- */
function go(view) { ui.view = view; ui.armed = false; document.body.scrollTop = 0; render(); }

document.addEventListener("click", e => {
  const tip = e.target.closest("[data-tip]");
  if (tip) { const r = tip.closest(".pcard").querySelector(".readout"); r.textContent = tip.dataset.tip; return; }
  const t = e.target.closest("[data-go],[data-day],[data-week],[data-newweek],[data-pday]");
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.day) { ui.day = +t.dataset.day; return go("day"); }
  if (t.dataset.pday) { ui.pday = +t.dataset.pday; ui._keepScroll = true; return render(); }
  if (t.dataset.week) {
    const nw = Math.min(S.meta.week, Math.max(1, viewWeek() + (+t.dataset.week)));
    ui.week = nw === S.meta.week ? null : nw; ui._keepScroll = true; return render();
  }
  if (t.hasAttribute("data-newweek")) {
    if (!ui.armed) { ui.armed = true; render(); setTimeout(() => { if (ui.armed) { ui.armed = false; if (ui.view === "home") render(); } }, 4000); return; }
    S.meta.week += 1; ui.week = null; ui.armed = false; markDirty("meta"); render();
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (!t.dataset || t.dataset.k === undefined) return;
  const n = viewWeek(), k = t.dataset.k, s = +t.dataset.s, f = +t.dataset.f;
  const wk = S.weeks[n] || (S.weeks[n] = { logs: {} });
  const arr = wk.logs[k] || (wk.logs[k] = []);
  for (let j = 0; j <= s; j++) if (!arr[j]) arr[j] = ["", ""];
  arr[s][f] = t.value;
  const row = t.closest("[data-row]"); if (row) row.classList.toggle("done", filled(arr[s]));
  markDirty("w" + n);
});

render();
boot();

/* ---------- Export / import ---------- */
function setMsg(t) { ui.bmsg = t; const el = document.getElementById("bmsg"); if (el) el.textContent = t; }
async function exportData() {
  const payload = JSON.stringify({ app: "blackout-protocol", version: 1, exportedAt: new Date().toISOString(), data: S }, null, 2);
  const name = "blackout-protocol-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  try {
    const file = new File([payload], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Blackout Protocol backup" });
      setMsg("Backup ready. Choose Save to Files to keep it."); return;
    }
  } catch (e) { if (e && e.name === "AbortError") { setMsg("Export cancelled."); return; } }
  try {
    const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setMsg("Backup downloaded: " + name);
  } catch (e) { setMsg("Could not export. Try again."); }
}
function cleanData(d) {
  const out = { meta: { week: Math.max(1, Math.floor(+d.meta.week) || 1), notes: typeof d.meta.notes === "string" ? d.meta.notes : "", top: {} }, weeks: {} };
  if (d.meta.top && typeof d.meta.top === "object") Object.keys(d.meta.top).forEach(k => { const v = d.meta.top[k]; if (/^\d+:\d+$/.test(k) && Array.isArray(v) && v.length === 2) out.meta.top[k] = [+v[0] || 0, +v[1] || 0]; });
  Object.keys(d.weeks).forEach(n => {
    if (!/^\d+$/.test(n) || !d.weeks[n] || typeof d.weeks[n].logs !== "object") return;
    const logs = {};
    Object.keys(d.weeks[n].logs).forEach(k => {
      const arr = d.weeks[n].logs[k];
      if (/^\d+:\d+$/.test(k) && Array.isArray(arr)) logs[k] = arr.slice(0, 12).map(s => [String((s && s[0]) ?? ""), String((s && s[1]) ?? "")]);
    });
    out.weeks[+n] = { logs };
  });
  return out;
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-export],[data-import],[data-confirm-import],[data-cancel-import],[data-reset]");
  if (!t) return;
  if (t.hasAttribute("data-export")) return exportData();
  if (t.hasAttribute("data-reset")) return askReset();
  if (t.hasAttribute("data-import")) { const f = document.getElementById("importFile"); if (f) f.click(); return; }
  if (t.hasAttribute("data-cancel-import")) { ui.pending = null; ui.bmsg = "Import cancelled."; return render(); }
  if (t.hasAttribute("data-confirm-import") && ui.pending) {
    S = cleanData(ui.pending); ui.pending = null; ui.week = null; backup(); setStatus("device");
    ui.bmsg = "Data imported. You are on week " + S.meta.week + "."; render();
  }
});
document.addEventListener("change", e => {
  if (e.target.id !== "importFile") return;
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || o.app !== "blackout-protocol" || !o.data || !o.data.meta || typeof o.data.weeks !== "object") throw 0;
      ui.pending = o.data;
      const wk = Object.keys(o.data.weeks).length;
      ui.bmsg = "File ready: " + wk + " week" + (wk === 1 ? "" : "s") + " of logs, currently week " + (o.data.meta.week || 1) + ". Replace the data on this phone with it?";
    } catch (err) { ui.pending = null; ui.bmsg = "That file is not a Blackout Protocol backup."; }
    render();
  };
  rd.readAsText(f); e.target.value = "";
});
</script>
</body>
